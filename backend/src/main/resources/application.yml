server:
  port: 8080

spring:
  application:
    name: sacode-backend

  datasource:
    # Supabase Dashboard -> Connect to your project -> Connection string -> URI
    #   Direct connection : jdbc:postgresql://db.<REF>.supabase.co:5432/postgres
    #   Pooler (serverless): jdbc:postgresql://aws-0-<REGION>.pooler.supabase.com:6543/postgres
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      pool-name: sacode-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  # AI triage — picks the brain behind the decision.
  #   gemini : hosted, free AI Studio key, nothing to download (default)
  #   ollama : local model such as gemma4:e2b, for offline demos
  triage:
    provider: ${TRIAGE_PROVIDER:gemini}
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      api-key: ${GEMINI_API_KEY:}
    ollama-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma4:e2b}
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
    # Photos are downscaled to this longest edge before they reach a model.
    # Image tokens scale with resolution, so 1024 keeps them (and the bill) small.
    max-image-edge: ${TRIAGE_MAX_IMAGE_EDGE:1024}
