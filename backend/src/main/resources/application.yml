server:
  port: 8080

spring:
  application:
    name: sacode-backend

  datasource:
    # Supabase Dashboard -> Connect to your project -> Connection string -> URI
    #   Direct connection : jdbc:postgresql://db.<REF>.supabase.co:5432/postgres
    #   Pooler (serverless): jdbc:postgresql://aws-0-<REGION>.pooler.supabase.com:6543/postgres
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      pool-name: sacode-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
